<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#fff8ed">
	<title>Create your account</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #202326;
			--muted: #747978;
			--coral: #f36f5b;
			--teal: #137e78;
			--yellow: #f4c84a;
			--line: #e8e5dc;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			color: var(--ink);
			background-color: #fff8ed;
			background-image: radial-gradient(#e9d9bd 0.8px, transparent 0.8px);
			background-size: 19px 19px;
			font-family: "DM Sans", sans-serif;
		}

		.layout {
			width: min(100%, 1000px);
			min-height: 650px;
			display: grid;
			grid-template-columns: 0.92fr 1.08fr;
			overflow: hidden;
			background: #fff;
			border: 1px solid rgba(32, 35, 38, 0.08);
			border-radius: 8px;
			box-shadow: 0 24px 70px rgba(64, 52, 30, 0.13);
			animation: arrive 550ms ease-out both;
		}

		.intro {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			overflow: hidden;
			padding: 42px;
			color: #fff;
			background: var(--teal);
		}

		.intro::after {
			position: absolute;
			right: -115px;
			bottom: -145px;
			width: 350px;
			height: 350px;
			border: 1px solid rgba(255, 255, 255, 0.24);
			border-radius: 50%;
			box-shadow: 0 0 0 32px rgba(255, 255, 255, 0.055), 0 0 0 67px rgba(255, 255, 255, 0.045);
			content: "";
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-family: Manrope, sans-serif;
			font-size: 17px;
			font-weight: 800;
		}

		.brand-mark {
			display: grid;
			width: 30px;
			height: 30px;
			place-items: center;
			color: var(--ink);
			background: var(--yellow);
			border-radius: 50%;
			font-size: 17px;
		}

		.intro-copy { position: relative; z-index: 1; margin: auto 0; }

		.eyebrow {
			margin: 0 0 18px;
			color: #b9e8da;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		h1, h2, p { margin-top: 0; }

		h1 {
			max-width: 370px;
			margin-bottom: 18px;
			font-family: Manrope, sans-serif;
			font-size: clamp(36px, 4vw, 52px);
			font-weight: 800;
			line-height: 1.08;
		}

		.intro-copy > p:last-child {
			max-width: 330px;
			margin-bottom: 0;
			color: #d3eee5;
			font-size: 15px;
			line-height: 1.7;
		}

		.aside-note {
			position: relative;
			z-index: 1;
			margin: 0;
			color: #d3eee5;
			font-size: 12px;
		}

		.form-panel { padding: 48px 54px; }

		.form-heading { margin-bottom: 28px; }

		h2 {
			margin-bottom: 7px;
			font-family: Manrope, sans-serif;
			font-size: 27px;
			font-weight: 800;
		}

		.form-heading p {
			margin-bottom: 0;
			color: var(--muted);
			font-size: 14px;
		}

		form { display: grid; gap: 17px; }

		.field { display: grid; gap: 7px; }

		label {
			color: #383d3b;
			font-size: 13px;
			font-weight: 700;
		}

		input {
			width: 100%;
			height: 47px;
			padding: 0 14px;
			color: var(--ink);
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 4px;
			outline: none;
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #a6aaa6; }

		input:focus {
			border-color: var(--teal);
			box-shadow: 0 0 0 3px rgba(19, 126, 120, 0.13);
		}

		.name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }

		.terms {
			display: flex;
			align-items: flex-start;
			gap: 10px;
			margin-top: 1px;
			color: #656b68;
			font-size: 12px;
			line-height: 1.55;
		}

		.terms input {
			flex: 0 0 16px;
			width: 16px;
			height: 16px;
			margin: 1px 0 0;
			accent-color: var(--teal);
		}

		.terms label { color: inherit; font-size: inherit; font-weight: 500; }

		.terms a, .sign-in a { color: var(--teal); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }

		button {
			min-height: 49px;
			margin-top: 2px;
			color: #fff;
			background: var(--coral);
			border: 0;
			border-radius: 4px;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:hover { background: #df5c49; transform: translateY(-1px); }
		button:focus-visible { outline: 3px solid rgba(243, 111, 91, 0.35); outline-offset: 3px; }

		.sign-in {
			margin: 3px 0 0;
			color: var(--muted);
			font-size: 13px;
			text-align: center;
		}

		.form-status {
			min-height: 18px;
			margin: -6px 0 0;
			color: var(--teal);
			font-size: 12px;
			line-height: 1.5;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 720px) {
			body { padding: 16px; }
			.layout { max-width: 500px; grid-template-columns: 1fr; }
			.intro { min-height: 235px; padding: 26px 28px; }
			.intro-copy { margin: 36px 0 20px; }
			h1 { max-width: 360px; margin-bottom: 10px; font-size: 36px; }
			.intro-copy > p:last-child { font-size: 13px; }
			.aside-note { display: none; }
			.form-panel { padding: 32px 28px; }
		}

		@media (max-width: 390px) {
			.name-row { grid-template-columns: 1fr; }
			.form-panel { padding-inline: 22px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="layout">
		<aside class="intro" aria-labelledby="welcome-title">
			<div class="brand"><span class="brand-mark" aria-hidden="true">+</span> Student Connect</div>
			<div class="intro-copy">
				<p class="eyebrow">Made for students</p>
				<h1 id="welcome-title">Find your people on campus.</h1>
				<p>Meet classmates, discover campus opportunities, and make the most of student life.</p>
			</div>
			<p class="aside-note">Your campus community starts here.</p>
		</aside>

		<section class="form-panel" aria-labelledby="form-title">
			<header class="form-heading">
				<h2 id="form-title">Join the student community</h2>
				<p>Create your student account to get started.</p>
			</header>

			<form id="registration-form">
				<div class="name-row">
					<div class="field">
						<label for="first-name">First name</label>
						<input id="first-name" name="firstName" type="text" placeholder="Jamie" autocomplete="given-name" required>
					</div>
					<div class="field">
						<label for="last-name">Last name</label>
						<input id="last-name" name="lastName" type="text" placeholder="Taylor" autocomplete="family-name" required>
					</div>
				</div>

				<div class="field">
					<label for="school">School or university</label>
					<input id="school" name="school" type="text" placeholder="Your school name" autocomplete="organization" required>
				</div>

				<div class="field">
					<label for="email">Student email address</label>
					<input id="email" name="email" type="email" placeholder="you@school.edu" autocomplete="email" required>
				</div>

				<div class="field">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
				</div>

				<div class="field">
					<label for="confirm-password">Confirm password</label>
					<input id="confirm-password" name="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
				</div>

				<div class="terms">
					<input id="terms" name="terms" type="checkbox" required>
					<label for="terms">I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</label>
				</div>

				<button type="submit">Create student account</button>
				<p class="form-status" id="form-status" role="status" aria-live="polite"></p>
				<p class="sign-in">Already have an account? <a href="#sign-in">Sign in</a></p>
			</form>
		</section>
	</main>

	<script>
		const form = document.querySelector("#registration-form");
		const password = document.querySelector("#password");
		const confirmPassword = document.querySelector("#confirm-password");
		const status = document.querySelector("#form-status");

		function checkPasswordMatch() {
			confirmPassword.setCustomValidity(
				confirmPassword.value && confirmPassword.value !== password.value
					? "Passwords do not match."
					: ""
			);
		}

		password.addEventListener("input", checkPasswordMatch);
		confirmPassword.addEventListener("input", checkPasswordMatch);

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			checkPasswordMatch();
			if (!form.reportValidity()) return;
			status.textContent = "Your details are valid. Connect a registration service to create the account.";
		});
	</script>
</body>
</html>
